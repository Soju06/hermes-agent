      streaming: true
      # ADR-008 (Phase 3a): per-peer mirror_channels.
      # Bot-A가 어느 peer에 응답하든 peer별로 별도 channel.
      # Bot-B peer (1502705976233558126) → existing mesh-ab channel (Phase 2.5)
      # Bot-C peer (1503019818062839958) → mesh-ac channel (Phase 3a new)
      mirror_channels:
        "1502705976233558126": "1502907302901055679"
        "1503019818062839958": "1502907302901055679"
        default: "1502907302901055679"

platforms:
  a2a:
    enabled: true
    extra:
      listen: "0.0.0.0:8800"
      peers:
        - "http://a2a-bot-b:8801/"
        - "http://a2a-bot-c:8802/"
      max_turns_per_conversation: 2
      agent_card:
        url: "http://a2a-bot-a:8800/"
        name: "A-bot"
        description: "Sandbox A2A+Discord bot — peer of B-bot and C-bot (Phase 3a)"
        discord_bot_user_id: "1502705819290963999"

  discord:
    enabled: true
    extra:
      free_response_channels:
        - "1502907302901055679"

memory:
  provider: ""

